name: Update league site

on:
  schedule:
    - cron: "0 12 * * *"    # ~6-7 am Central
    - cron: "45 5 * * 2"    # Tuesday ~11:45 pm Central, after Monday Night Football
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: sleeper-raw-1350581422095622144-${{ github.run_id }}
          restore-keys: sleeper-raw-1350581422095622144-
      - name: Fetch Sleeper data
        run: python3 fetch.py
      - name: Fetch KeepTradeCut values
        run: python3 ktc.py
        continue-on-error: true
      - name: Build page data
        run: python3 build.py
      - name: Data check
        run: python3 check.py && python3 dbg_h2h.py
      - name: Save KTC history to the repo
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ktc
          git diff --cached --quiet || (git commit -q -m "KTC snapshot $(date -u +%F)" && git pull -q --rebase && git push -q)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
