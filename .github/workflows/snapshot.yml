name: roster snapshot (temporary)
on:
  push:
    branches: [claude/roster-snapshot]
    paths: [snap.py, .github/workflows/snapshot.yml]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 snap.py
      - run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot
          git commit -q -m "Roster snapshot" && git push -q
